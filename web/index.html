<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Piano</title>
  <meta name="description" content="Play a two-octave piano in the air with your webcam and both hands." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivory: #F4EFE3;
      --ivory-dim: rgba(244, 239, 227, 0.62);
      --cobalt: #4C7DFF;   /* hand 1 */
      --brass: #F0B347;    /* hand 2 */
      --felt: #8E1F2A;     /* the red felt strip above real piano keys */
      --sage: #7FD69A;
      --piano-h: 55vh;     /* must match PIANO_TOP in getHoveredKey */
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; color: var(--ivory); font-family: 'Familjen Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1; }
    #overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 12; pointer-events: none; }

    /* Top bar: scrim keeps text readable over any camera image */
    .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px; padding: 18px 28px 40px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .wordmark { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
    .wordmark svg { width: 22px; height: 22px; }
    .panel { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; font-size: 0.95rem; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--ivory); }
    .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--brass); flex: none; }
    .status[data-state="tracking"]::before { background: var(--sage); box-shadow: 0 0 0 4px rgba(127,214,154,0.25); }
    .status[data-state="idle"]::before { background: var(--ivory-dim); }
    .status[data-state="error"]::before { background: #FF6B5E; }
    .count { color: var(--ivory-dim); font-variant-numeric: tabular-nums; }
    .count b { color: var(--ivory); font-weight: 600; }
    .sens { display: flex; align-items: center; gap: 10px; color: var(--ivory-dim); }
    .sens input { width: 120px; accent-color: var(--ivory); }
    .sens output { color: var(--ivory); font-variant-numeric: tabular-nums; min-width: 2ch; }

    /* Keyboard: see-through glass keys so your fingers stay visible under them */
    .piano { position: absolute; bottom: 0; left: 0; width: 100vw; height: var(--piano-h); z-index: 10; display: flex; border-top: 4px solid var(--felt); }
    .white-key { flex: 1; position: relative; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 14px; background: linear-gradient(rgba(244,239,227,0.04), rgba(244,239,227,0.16)); border-right: 1px solid rgba(244,239,227,0.32); border-radius: 0 0 6px 6px; color: var(--ivory); font-size: 0.82rem; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); transition: background 0.12s, box-shadow 0.12s; }
    .white-key:last-of-type { border-right: 0; }
    .black-key { position: absolute; top: 0; width: 4.6vw; height: 72.7%; transform: translateX(-50%); z-index: 11; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; background: rgba(6,6,8,0.62); border: 1px solid rgba(244,239,227,0.18); border-top: 0; border-radius: 0 0 5px 5px; color: var(--ivory-dim); font-size: 0.7rem; font-weight: 500; transition: background 0.12s, box-shadow 0.12s; }

    .white-key.hov0, .black-key.hov0 { box-shadow: inset 0 0 0 2px var(--cobalt); background: rgba(76,125,255,0.16); }
    .white-key.hov1, .black-key.hov1 { box-shadow: inset 0 0 0 2px var(--brass); background: rgba(240,179,71,0.16); }
    .white-key.press0, .black-key.press0 { background: rgba(76,125,255,0.62); color: #fff; }
    .white-key.press1, .black-key.press1 { background: rgba(240,179,71,0.68); color: #1a1205; text-shadow: none; }

    /* Note trails: each note rises from its key in the colour of the hand that played it */
    .trail { position: fixed; bottom: var(--piano-h); z-index: 11; height: 34vh; transform-origin: bottom; pointer-events: none; border-radius: 4px 4px 0 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 0.85rem; font-weight: 600; animation: rise 1.3s cubic-bezier(.2,.7,.3,1) forwards; }
    .trail.h0 { background: linear-gradient(rgba(76,125,255,0), rgba(76,125,255,0.85)); color: #fff; }
    .trail.h1 { background: linear-gradient(rgba(240,179,71,0), rgba(240,179,71,0.9)); color: #1a1205; }
    @keyframes rise {
      0% { transform: scaleY(0.2); opacity: 1; }
      45% { opacity: 1; }
      100% { transform: scaleY(1) translateY(-8vh); opacity: 0; }
    }

    /* Start screen sits over the keyboard so the first thing you see is the instrument */
    /* Copy fills the space above the keyboard: headline left, instructions right */
    .start-ov { position: fixed; inset: 0; z-index: 50; background: linear-gradient(rgba(0,0,0,0.94) calc(100% - var(--piano-h)), rgba(0,0,0,0.5)); transition: opacity 0.5s; }
    .start-ov.hidden { opacity: 0; pointer-events: none; }
    .start-inner { height: calc(100% - var(--piano-h)); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: end; gap: 24px clamp(24px, 5vw, 80px); padding: 72px clamp(20px, 6vw, 96px) clamp(24px, 5vh, 48px); }
    .start-ov h1 { margin: 0; font-size: clamp(2.6rem, 7vw, 6.4rem); line-height: 0.92; font-weight: 700; letter-spacing: -0.04em; }
    .start-copy { display: flex; flex-direction: column; max-width: 44ch; }
    .start-ov p { margin: 0 0 22px; font-size: clamp(1rem, 1.3vw, 1.12rem); line-height: 1.5; color: var(--ivory-dim); }
    .start-ov .fine { margin: 14px 0 0; font-size: 0.86rem; }
    @media (max-width: 900px), (max-height: 560px) {
      .start-ov { background: rgba(0,0,0,0.9); }
      .start-inner { height: 100%; grid-template-columns: 1fr; align-content: center; align-items: start; }
    }
    .btn { align-self: flex-start; padding: 15px 30px; font: 600 1.05rem 'Familjen Grotesk', system-ui, sans-serif; color: #120F0A; background: var(--ivory); border: 0; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #fff; }
    .btn:focus-visible, .sens input:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }

    @media (max-width: 700px) {
      .bar { padding: 14px 16px 32px; }
      .sens input { width: 90px; }
      .white-key { font-size: 0.66rem; }
      .black-key { font-size: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .trail { animation: fade 0.8s forwards; }
      @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
      .start-ov { transition: none; }
    }
  </style>
</head>
<body>
<section class="start-ov" id="startOv" aria-labelledby="startTitle">
  <div class="start-inner">
    <h1 id="startTitle">Play piano<br />in the air.</h1>
    <div class="start-copy">
      <p>Hold your hands up to the camera, point a finger at a key and bend it to play. Both hands work, with up to three notes at once on each.</p>
      <button class="btn" id="startBtn" onclick="startCamera()">Turn on camera</button>
      <p class="fine">Works best in good light with your whole hand in view. The video stays on your device.</p>
    </div>
  </div>
</section>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<header class="bar">
  <div class="wordmark">
    <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="3" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v16M14 3v16" stroke="currentColor" stroke-width="1.2"/><rect x="6" y="3" width="4" height="9" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="9" rx="1" fill="currentColor"/></svg>
    Air Piano
  </div>
  <div class="panel" id="panel" style="display:none">
    <div class="status" id="status" data-state="loading" role="status">Loading hand tracking…</div>
    <div class="count"><b id="hCount">0</b> <span id="hWord">hands</span>, <b id="totalNotes">0</b> notes</div>
    <label class="sens">Press sensitivity
      <input type="range" id="sensSlider" min="20" max="90" value="55" oninput="SENS=parseInt(this.value); document.getElementById('sVal').value=this.value;" />
      <output id="sVal">55</output>
    </label>
  </div>
</header>

<div class="piano" id="piano"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const WHITE_KEYS = [
  {note:'C3', file:'c3.mp3'}, {note:'D3', file:'d3.mp3'}, {note:'E3', file:'e3.mp3'}, {note:'F3', file:'f3.mp3'},
  {note:'G3', file:'g3.mp3'}, {note:'A3', file:'a3.mp3'}, {note:'B3', file:'b3.mp3'},
  {note:'C4', file:'c4.mp3'}, {note:'D4', file:'d4.mp3'}, {note:'E4', file:'e4.mp3'}, {note:'F4', file:'f4.mp3'},
  {note:'G4', file:'g4.mp3'}, {note:'A4', file:'a4.mp3'}, {note:'B4', file:'b4.mp3'}
];
const BLACK_KEYS = [
  {note:'C#3', file:'c-3.mp3', b: 1}, {note:'D#3', file:'d-3.mp3', b: 2},
  {note:'F#3', file:'f-3.mp3', b: 4}, {note:'G#3', file:'g-3.mp3', b: 5}, {note:'A#3', file:'a-3.mp3', b: 6},
  {note:'C#4', file:'c-4.mp3', b: 8}, {note:'D#4', file:'d-4.mp3', b: 9},
  {note:'F#4', file:'f-4.mp3', b: 11}, {note:'G#4', file:'g-4.mp3', b: 12}, {note:'A#4', file:'a-4.mp3', b: 13}
];
const ALL_KEYS = [];
const piano = document.getElementById('piano');

WHITE_KEYS.forEach(k => {
  k.isBlack = false; k.idx = ALL_KEYS.length; ALL_KEYS.push(k);
  const el = document.createElement('div');
  el.className = 'white-key'; el.id = 'k' + k.idx;
  el.innerHTML = `<span>${k.note}</span>`;
  piano.appendChild(el);
});

BLACK_KEYS.forEach(k => {
  k.isBlack = true; k.idx = ALL_KEYS.length; ALL_KEYS.push(k);
  const el = document.createElement('div');
  el.className = 'black-key'; el.id = 'k' + k.idx;
  el.style.left = `calc((100vw / 14) * ${k.b})`;
  el.innerHTML = `<span>${k.note}</span>`;
  piano.appendChild(el);
});

let SENS = 55;
let totalNotes = 0;
// Web Audio: compressor glues chords instead of clipping; voice cap stops long smears
const actx = new (window.AudioContext || window.webkitAudioContext)();
const master = actx.createDynamicsCompressor();
master.threshold.value = -18; master.ratio.value = 4;
master.connect(actx.destination);
const buffers = {}, boost = {};
ALL_KEYS.forEach(k => fetch('/tunes/' + k.file).then(r => r.arrayBuffer())
  .then(b => actx.decodeAudioData(b)).then(buf => {
    // The mp3s peak around 0.05 (about -26 dB); normalise each so notes are actually audible
    let peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) for (const v of buf.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
    boost[k.file] = peak > 0 ? 0.9 / peak : 1;
    buffers[k.file] = buf;
  }).catch(() => {}));
const MAX_VOICES = 6;
const voices = [];
let lastStartAt = 0, chord = [];

function playBuffer(file) {
  const buf = buffers[file];
  if (!buf) return;
  if (actx.state !== 'running') actx.resume();
  const t = actx.currentTime;
  // Notes starting together share loudness so a 3-note chord isn't 3x as loud
  if (t - lastStartAt >= 0.05) chord = [];
  lastStartAt = t;
  const g = actx.createGain();
  const src = actx.createBufferSource();
  src.buffer = buf; src.connect(g); g.connect(master); src.start();
  const v = { src, g, boost: boost[file] };
  voices.push(v);
  chord.push(v);
  chord.forEach(c => { c.g.gain.value = c.boost / Math.sqrt(chord.length); });
  src.onended = () => { const i = voices.indexOf(v); if (i >= 0) voices.splice(i, 1); };
  while (voices.length > MAX_VOICES) {
    const old = voices.shift();
    old.g.gain.setTargetAtTime(0, t, 0.03);
    old.src.stop(t + 0.15);
  }
}

const MAX_HANDS = 2;
// MCP landmark of index, middle, ring, pinky (thumb curl is too unreliable to play with)
const FINGER_BASES = [5, 9, 13, 17];
const MAX_NEW_PER_HAND = 3;   // caps sympathetic curls (ring/pinky move together)
const KEY_LOCK_MS = 200;      // one key can't re-fire faster than this, from any finger
const FINGER_LOCK_MS = 150;
const RELEASE_GAP = 0.08;     // hysteresis: finger must straighten this much past threshold to re-arm
const AIM_FRAMES = 4;         // ~130ms of aim history at 30fps
const newFingers = () => FINGER_BASES.map(() => ({ frames: 0, down: false, lastAt: 0, aim: [] }));
const HS = [
  { smoothLm: null, fingers: newFingers() },
  { smoothLm: null, fingers: newFingers() }
];
const keyLastAt = {};
const HOV_CLASS = ['hov0', 'hov1'], PRS_CLASS = ['press0', 'press1'];
const H_COLOR = ['#4C7DFF', '#F0B347']; // cobalt / brass, same as the CSS tokens

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
let videoW = 640, videoH = 480;

video.addEventListener('loadedmetadata', () => {
  videoW = video.videoWidth; videoH = video.videoHeight;
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function setStatus(text, state) {
  const el = document.getElementById('status');
  if (el.textContent !== text) { el.textContent = text; el.dataset.state = state; }
}

// Start the ~10 MB model download on page load, not on click, so tracking is ready sooner
const hands = new Hands({ locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f });
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
hands.onResults(r => onResults(r));
const handsReady = hands.initialize().catch(e => setStatus('Hand tracking failed to load. Check your connection and reload.', 'error'));

async function startCamera() {
  actx.resume(); // browsers only allow audio after a user click
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('panel').style.display = 'flex';
  resize();

  const cam = new Camera(video, {
    // send() before the preload finishes starts a second init, which crashes MediaPipe's wasm FS (ErrnoError)
    onFrame: async () => { await handsReady; await hands.send({ image: video }); },
    width: 800, height: 600
  });
  cam.start().catch(e => setStatus('Camera is blocked. Allow camera access in your browser, then reload.', 'error'));
}

// 3D distance in square units: x and z are width-normalised, y is height-normalised
function d3(a, b) {
  const ar = videoW && videoH ? videoW / videoH : 1;
  return Math.sqrt(((a.x-b.x)*ar)**2 + (a.y-b.y)**2 + ((a.z-b.z)*ar)**2);
}
function getCurlRatio(lm, base) {
  const MCP=lm[base], PIP=lm[base+1], DIP=lm[base+2], TIP=lm[base+3];
  const len = d3(MCP,PIP) + d3(PIP,DIP) + d3(DIP,TIP);
  if (len < 0.001) return 1;
  return d3(TIP, MCP) / len;
}
function curlThr() { return 0.85 - (SENS - 20) * (0.40 / 70); }

function smoothLandmarks(raw, hi) {
  const s = HS[hi], SMOOTH = 0.45;
  if (!s.smoothLm) { s.smoothLm = raw.map(l => ({x:l.x,y:l.y,z:l.z})); return s.smoothLm; }
  s.smoothLm = raw.map((l, i) => ({
    x: s.smoothLm[i].x * SMOOTH + l.x * (1-SMOOTH),
    y: s.smoothLm[i].y * SMOOTH + l.y * (1-SMOOTH),
    z: s.smoothLm[i].z * SMOOTH + l.z * (1-SMOOTH)
  }));
  return s.smoothLm;
}

function getScreenCoords(lx, ly) {
  const sw = window.innerWidth, sh = window.innerHeight;
  if (!videoW) return { x: lx, y: ly };
  const vRatio = videoW / videoH, sRatio = sw / sh;
  let rw, rh, ox = 0, oy = 0;
  if (sRatio > vRatio) { rw = sw; rh = sw / vRatio; oy = (sh - rh) / 2; } 
  else { rh = sh; rw = rh * vRatio; ox = (sw - rw) / 2; }
  return { x: (ox + lx * rw) / sw, y: (oy + ly * rh) / sh };
}

function getHoveredKey(sx, sy) {
  // Match the drawn piano: .piano is the bottom 55vh (reachable without hands leaving the camera), black keys 72.7% of it
  const PIANO_TOP = 0.45, BLACK_BOTTOM = PIANO_TOP + 0.55 * 0.727;
  if (sy < PIANO_TOP) return -1;
  const numWhite = 14, wWidth = 1 / numWhite, bWidth = 0.045;
  if (sy < BLACK_BOTTOM) {
    for (let k of BLACK_KEYS) {
      const center = k.b * wWidth;
      if (sx > center - bWidth/2 && sx < center + bWidth/2) return k.idx;
    }
  }
  const wIdx = Math.floor(sx * numWhite);
  if (wIdx >= 0 && wIdx < numWhite) return WHITE_KEYS[wIdx].idx;
  return -1;
}

function playNote(keyIdx, handIdx) {
  const k = ALL_KEYS[keyIdx];
  playBuffer(k.file);

  const ke = document.getElementById('k' + keyIdx);
  if (ke) {
    ke.classList.add(PRS_CLASS[handIdx]);
    setTimeout(() => ke.classList.remove(PRS_CLASS[handIdx]), 300);
  }

  totalNotes++;
  document.getElementById('totalNotes').textContent = totalNotes;

  if (ke) {
    const r = ke.getBoundingClientRect(), tr = document.createElement('div');
    tr.className = 'trail h' + handIdx;
    tr.textContent = k.note;
    tr.style.left = (r.left + r.width * 0.15) + 'px';
    tr.style.width = (r.width * 0.7) + 'px';
    tr.addEventListener('animationend', () => tr.remove());
    document.body.appendChild(tr);
  }
}

function drawHand(screenLm, hi, pressedTips) {
  const col = H_COLOR[hi];
  const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  const sw = window.innerWidth, sh = window.innerHeight;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 3;
  CONN.forEach(([a, b]) => {
    ctx.beginPath(); ctx.moveTo(screenLm[a].x * sw, screenLm[a].y * sh); ctx.lineTo(screenLm[b].x * sw, screenLm[b].y * sh); ctx.stroke();
  });
  screenLm.forEach((l, i) => {
    const x = l.x * sw, y = l.y * sh;
    const isTip = FINGER_BASES.includes(i - 3), pressing = pressedTips.includes(i);
    ctx.beginPath(); ctx.arc(x, y, isTip ? 10 : 5, 0, Math.PI*2);
    ctx.fillStyle = isTip ? (pressing ? '#F4EFE3' : col) : col+'88';
    ctx.fill();
    if (pressing) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.shadowColor = pressing ? '#F4EFE3' : col; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;
    }
  });
  ctx.restore();
}

function onResults(results) {
  const sw = canvas.width, sh = canvas.height;
  ctx.clearRect(0, 0, sw, sh);
  const rawHands = results.multiHandLandmarks || [];
  const handedness = results.multiHandedness || [];
  document.getElementById('hCount').textContent = rawHands.length;
  document.getElementById('hWord').textContent = rawHands.length === 1 ? 'hand' : 'hands';
  if (rawHands.length) setStatus('Tracking. Bend a finger over a key to play', 'tracking');
  else setStatus('Show your whole hand to the camera', 'idle');

  // Persist hand identity across frames using MediaPipe's handedness label
  const activeIds = [];
  for (let i = 0; i < rawHands.length; i++) {
    const label = handedness[i] ? handedness[i].label : (i === 0 ? 'Left' : 'Right');
    let hi = label === 'Left' ? 0 : 1;
    if (activeIds.includes(hi)) hi = 1 - hi; // Fallback if both detected as same hand
    activeIds.push(hi);
  }

  // Clear hands that are no longer active
  for (let hi = 0; hi < MAX_HANDS; hi++) {
    if (!activeIds.includes(hi)) {
      const s = HS[hi];
      if (s.smoothLm) {
        s.smoothLm = null; s.fingers = newFingers();
        document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.remove(HOV_CLASS[hi], PRS_CLASS[hi]));
      }
    }
  }

  for (let i = 0; i < Math.min(rawHands.length, MAX_HANDS); i++) {
    const hi = activeIds[i];
    const s = HS[hi], raw = rawHands[i];
    const lm = smoothLandmarks(raw, hi).map(l => ({ x: 1-l.x, y: l.y, z: l.z }));
    const screenLm = lm.map(l => getScreenCoords(l.x, l.y));
    const thr = curlThr(), now = performance.now();
    const hovered = new Set(), pressedTips = [], fresh = [];

    FINGER_BASES.forEach((base, fi) => {
      const f = s.fingers[fi], curl = getCurlRatio(lm, base);
      f.frames = curl < thr ? Math.min(f.frames + 1, 4) : Math.max(f.frames - 1, 0);
      if (f.down && f.frames === 0 && curl > thr + RELEASE_GAP) f.down = false;

      const tip = screenLm[base + 3];
      const tipKey = getHoveredKey(tip.x, tip.y);
      // A curling tip slides back toward the palm; play the key it pointed at a few frames before the press
      if (f.frames === 0) { f.aim.push(tipKey); if (f.aim.length > AIM_FRAMES) f.aim.shift(); }
      const keyIdx = f.aim.length && f.aim[0] >= 0 ? f.aim[0] : tipKey;
      if (keyIdx < 0) return;
      if (f.frames >= 2) pressedTips.push(base + 3); else hovered.add('k' + keyIdx);
      // Fire only on a fresh press: finger must have re-armed since its last note
      if (f.frames >= 2 && !f.down && now - f.lastAt > FINGER_LOCK_MS) fresh.push({ f, keyIdx, curl });
    });

    // Most-curled fingers win; the rest are consumed silently (neighbours that bent along by accident)
    fresh.forEach(({ f }) => { f.down = true; f.lastAt = now; });
    fresh.sort((a, b) => a.curl - b.curl).slice(0, MAX_NEW_PER_HAND).forEach(({ keyIdx }) => {
      if (now - (keyLastAt[keyIdx] || 0) < KEY_LOCK_MS) return;
      keyLastAt[keyIdx] = now;
      playNote(keyIdx, hi);
    });

    document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.toggle(HOV_CLASS[hi], hovered.has(k.id)));
    drawHand(screenLm, hi, pressedTips);
  }
}
</script>
